<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy House Dictionary</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <header class="glass header">
    <h1>Happy House</h1>
    <p class="sub">Толковый словарь · Limited Edition · 2026-2027</p>
  </header>

  <main class="glass panel" id="list"></main>

  <section class="glass panel hidden" id="detail">
    <button class="back" id="back">← Назад</button>
    <h2 id="dTerm"></h2>
    <p class="def" id="dDef"></p>
    <div class="ai" id="dAi" style="display: none;"></div>
    <button class="explain" id="btnExplain">✨ Пояснить от ИИ</button>
    <p class="footer-note" id="footerNote" style="display: none;">Сгенерировано AI, могут быть неточности</p>
  </section>

<script>
// --- БАЗА ДАННЫХ: ПО 3 УНИКАЛЬНЫХ ПОЯСНЕНИЯ ДЛЯ КАЖДОГО СЛОВА ---
const CUSTOM_EXPLANATIONS = {
  "твою мать!": [
    "Крылатая фраза великого участника. Обычно вырывается, когда понимаешь, что домашку по английскому опять не сделал, а до консультации 5 минут.",
    "Универсальное междометие. Подходит для выражения восторга, удивления или когда случайно наступил на ногу В. Сергеевне.",
    "Легендарное выражение. Иногда используется как заклинание перед сложной контрольной."
  ],
  "рыбенок": [
    "Малыш, который еще не познал дзен ОГЭ. Обычно бегает по коридорам и боится слова 'экзамен'.",
    "Ласковое обращение к младшеклассникам. Мы все были такими рыбками, пока не попали в сети Happy House.",
    "Тот, кто еще не сдал ОГЭ, но уже активно пытается списать."
  ],
  "мама птица": [
    "Виолетта Сергеевна в роли заботливой мамы. Следит, чтобы птенцы были сыты, обуты и знали английский.",
    "Наша главная защитница и наставница. Может пожалеть, а может заставить переписать конспект.",
    "Она же Чичер, она же Птичер. Уровень контроля — 99.9%."
  ],
  "чичер": [
    "Великий и ужасный (на самом деле добрый) учитель английского. Ее уроки запоминаются навсегда.",
    "Синоним слова 'авторитет'. Ее слово — закон в Happy House.",
    "Любимый учитель, который знает про нас всё (даже то, чего мы сами не знаем)."
  ],
  "сладкоежки с травмой": [
    "Наше состояние после того, как на консультации съели 3 кило конфет. Живот болит, но было вкусно.",
    "Психологическая травма от того, что чай закончился, а печеньки остались.",
    "Когда понимаешь, что сахарный диабет не за горами, но конфеты всё равно вкусные."
  ],
  "засланцы": [
    "Элитный отряд, который пахан отправил в магазин за хлебом и вкусняшками. Вернутся — будут героями.",
    "Те, кто знает, как выйти из класса незамеченным ради покупки газировки.",
    "Птенцы, которые выполняют спецмиссии по выживанию во время уроков."
  ],
  "space sheeps": [
    "Наш 9 'А'. Космические овцы, которые летят по просторам школьной программы, иногда врезаясь в астероиды ОГЭ.",
    "Команда мечты, которая может свернуть горы (или сорвать урок).",
    "Мы настолько уникальны, что нас можно отправлять в космос."
  ],
  "хоуюжели": [
    "Обычно. Но так говорят только свои. Интеллектуальная версия слова 'обычно'.",
    "Слово-паразит, которое делает речь умнее. Используй, чтобы казаться образованным.",
    "От слова usually. Идеально вставлять в сочинения по английскому."
  ],
  "i'm pindos": [
    "Неофициальный гимн Happy House. Сопровождается криком орла и мысленным включением гимна США.",
    "Лозунг, который объединяет нас. Скажи это на уроке — и ты свой.",
    "Кодовое слово, которое понимают только избранные."
  ],
  "блокнот": [
    "Страшное оружие В. Сергеевны. Если она его достала — кто-то сейчас получит замечание.",
    "Инструмент строгого учета прогулов и невыученных правил.",
    "Магический артефакт, который появляется из ниоткуда в самый неподходящий момент."
  ],
  "сладенький асланчик": [
    "Наш автор словаря. Сдаёт ОГЭ, но пока не уверен, что сдаст.",
    "Харизматичный парень, который знает толк в английском.",
    "Тот, кто разыскивается Интерполом (по его собственным словам)."
  ],
  "меня разыскивает интерпол": [
    "Фраза Аслана. Означает, что он занят и его лучше не трогать.",
    "Отмазка от неудобных вопросов и просьб.",
    "Высокий уровень секретности. Документы не показываем."
  ],
  "твою мать": [ /* Дублируем на случай, если нет восклицательного знака */
    "Крылатая фраза великого участника. Обычно вырывается, когда понимаешь, что домашку по английскому опять не сделал, а до консультации 5 минут.",
    "Универсальное междометие. Подходит для выражения восторга, удивления или когда случайно наступил на ногу В. Сергеевне.",
    "Легендарное выражение. Иногда используется как заклинание перед сложной контрольной."
  ]
};

// Стандартные пояснения (если слова нет в базе)
const DEFAULT_EXPLANATIONS = [
  "Это словечко из внутреннего сленга нашего класса. Обычно используется в узком кругу для описания забавной ситуации.",
  "Слово, которое понятно только избранным. Свои поймут с полуслова.",
  "Уникальное выражение Happy House. Употребляется, когда нужно поднять настроение или подколоть друга."
];

const tg = window.Telegram?.WebApp;
tg?.ready(); 
tg?.expand();
tg?.setHeaderColor?.("#0a0f1f");

let WORDS = [];
let current = null;

const list = document.getElementById("list");
const detail = document.getElementById("detail");
const dTerm = document.getElementById("dTerm");
const dDef = document.getElementById("dDef");
const dAi = document.getElementById("dAi");
const btnExplain = document.getElementById("btnExplain");
const back = document.getElementById("back");
const footerNote = document.getElementById("footerNote");

fetch("words.json")
  .then(r => r.json())
  .then(data => {
    WORDS = data;
    render();
  })
  .catch(err => {
    list.innerHTML = "<div style='color:red; padding:20px'>Ошибка загрузки словаря. Проверь words.json</div>";
  });

function render() {
  list.innerHTML = "";
  WORDS.forEach((w, i) => {
    const el = document.createElement("div");
    el.className = "word-item";
    el.innerHTML = `
      <div>
        <div class="word-term">${escapeHtml(w.term)}</div>
        <div class="word-def">${escapeHtml(truncate(w.def, 60))}</div>
      </div>
      <div class="chev">›</div>`;
    el.addEventListener("click", () => open(i));
    list.appendChild(el);
  });
}

function open(i) {
  current = { ...WORDS[i], idx: i };
  dTerm.textContent = current.term;
  dDef.textContent = current.def;
  
  dAi.style.display = "none";
  dAi.textContent = "";
  footerNote.style.display = "none";
  btnExplain.style.display = "block";
  btnExplain.textContent = "✨ Пояснить от ИИ";
  btnExplain.disabled = false;

  list.classList.add("hidden");
  detail.classList.remove("hidden");
  tg?.HapticFeedback?.impactOccurred("light");
}

back.addEventListener("click", () => {
  detail.classList.add("hidden");
  list.classList.remove("hidden");
  current = null;
});

btnExplain.addEventListener("click", () => {
  if (!current) return;
  
  btnExplain.textContent = "⏳ Думаю...";
  btnExplain.disabled = true;

  setTimeout(() => {
    const key = current.term.toLowerCase().trim().replace('!', '');
    let text = "";

    // Если для слова есть кастомные пояснения
    if (CUSTOM_EXPLANATIONS[key]) {
      const variants = CUSTOM_EXPLANATIONS[key];
      // Выбираем случайный вариант из массива
      text = variants[Math.floor(Math.random() * variants.length)];
    } else {
      // Если слова нет, берем случайное из дефолтных
      const defText = current.def.toLowerCase().replace(/\.$/, '');
      const randomDefault = DEFAULT_EXPLANATIONS[Math.floor(Math.random() * DEFAULT_EXPLANATIONS.length)];
      text = `«${current.term}» — это ${defText}. ${randomDefault}`;
    }

    dAi.textContent = text;
    dAi.style.display = "block";
    footerNote.style.display = "block";
    btnExplain.style.display = "none";
  }, 600);
});

function truncate(s, n) { return s.length > n ? s.slice(0, n) + "…" : s; }
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
</script>
</body>
</html>
