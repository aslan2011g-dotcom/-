<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy House Dictionary</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <header class="glass header">
    <h1>Happy House</h1>
    <p class="sub">Толковый словарь · Limited Edition · 2026-2027</p>
  </header>

  <main class="glass panel" id="list"></main>

  <section class="glass panel hidden" id="detail">
    <button class="back" id="back">← Назад</button>
    <h2 id="dTerm"></h2>
    <p class="def" id="dDef"></p>
    <div class="ai" id="dAi" style="display: none;"></div>
    <button class="explain" id="btnExplain">✨ Пояснить от ИИ</button>
    <p class="footer-note" id="footerNote" style="display: none;">Сгенерировано AI, могут быть неточности</p>
  </section>

<script>
// --- БАЗА ДАННЫХ С РАЗНООБРАЗНЫМИ ПОЯСНЕНИЯМИ ---
const CUSTOM_EXPLANATIONS = {
  "твою мать!": [
    "Фраза-мем. Обычно вырывается, когда В. Сергеевна неожиданно объявляет контрольную, а ты даже не открывал учебник.",
    "Используется для выражения крайнего изумления. Например, когда узнаешь, сколько всего нужно выучить к ОГЭ.",
    "Легендарное междометие от великого участника. Иногда работает как заклинание перед сложным тестом."
  ],
  "рыбенок": [
    "Тот, кто пока еще не познал дзен школьной жизни. Обычно бегает по коридорам с криками.",
    "Ласковое прозвище младших. Мы все когда-то были такими рыбками, пока не попали в сети ОГЭ.",
    "Мелкий представитель фауны Happy House. Требует защиты и присмотра на переменах."
  ],
  "мама птица": [
    "Виолетта Сергеевна в роли заботливой матери. Следит, чтобы стая не разлетелась и выучила английский.",
    "Главная защитница класса. Может пожалеть, а может заставить переписать конспект.",
    "Она же Чичер. Уровень контроля — строгий, но справедливый."
  ],
  "сладкоежки с травмой": [
    "Состояние после того, как на чаепитии съел слишком много конфет. Живот болит, но настроение отличное.",
    "Психологическая (и желудочная) травма от осознания, что печеньки закончились, а чай еще остался.",
    "Наш коллективный диагноз после долгих посиделок за сладким столом."
  ],
  "чичер": [
    "Учитель, чье имя стало синонимом слова 'авторитет'. Ее слово — закон.",
    "Любимый преподаватель. Обладает суперспособностью видеть списывающих через стены.",
    "Великий и ужасный (на самом деле добрый) наставник."
  ],
  "засланцы": [
    "Элитный отряд, который пахан отправил в магазин за вкусняшками. Вернутся — будут героями.",
    "Те, кто знает все секретные тропы до ближайшего супермаркета.",
    "Птенцы, выполняющие спецмиссии по выживанию во время уроков."
  ],
  "space sheeps": [
    "Наш 9 'А'. Космические овцы, которые летят по просторам школьной программы, иногда врезаясь в астероиды.",
    "Команда мечты, которая может сорвать урок, но сделать это с юмором.",
    "Мы настолько уникальны, что нас можно отправлять в космос без скафандров."
  ],
  "хоуюжели": [
    "Обычно. Но так говорят только свои. Интеллектуальная версия слова.",
    "Слово-паразит, которое делает речь умнее. Используй, чтобы казаться образованным.",
    "От слова usually. Идеально вставлять в сочинения по английскому."
  ],
  "i'm pindos": [
    "Неофициальный гимн. Сопровождается криком орла и мысленным включением гимна США.",
    "Лозунг, который объединяет нас. Скажи это на уроке — и ты свой.",
    "Кодовое слово, которое понимают только избранные."
  ],
  "блокнот": [
    "Страшное оружие В. Сергеевны. Если она его достала — кто-то сейчас получит замечание.",
    "Инструмент строгого учета прогулов и невыученных правил.",
    "Магический артефакт, который появляется из ниоткуда в самый неподходящий момент."
  ],
  "сладенький асланчик": [
    "Наш автор словаря. Сдаёт ОГЭ, но пока не уверен, что сдаст.",
    "Харизматичный парень, который знает толк в английском.",
    "Тот, кто разыскивается Интерполом (по его собственным словам)."
  ],
  "меня разыскивает интерпол": [
    "Фраза Аслана. Означает, что он занят и его лучше не трогать.",
    "Отмазка от неудобных вопросов и просьб.",
    "Высокий уровень секретности. Документы не показываем."
  ],
  "я (freak) тебя на подоконнике": [
    "Легендарная фраза от Владюши. В оригинале там было именно слово freak. Никаких пошлостей, только фотография на подоконнике!",
    "Искусство фотографии в исполнении Владюши. Обычно сопровождается поиском идеального света и ракурса.",
    "Так Владюша просит позировать. Если услышал это — готовься улыбаться в камеру."
  ],
  "кухарочка": [
    "Владюша в роли шеф-повара. Может приготовить что угодно (даже если это просто бутерброд).",
    "Наш главный по вкусностям. Если он на кухне — жди шедевра.",
    "Почетное звание Владюши за его кулинарные (или около того) таланты."
  ]
};

// Дефолтные пояснения для остальных слов (сделал их тоже разными)
const DEFAULT_EXPLANATIONS = [
  "Фраза из внутреннего сленга. Обычно используется в узком кругу для описания забавной ситуации.",
  "Слово, которое понятно только своим. Свои поймут с полуслова.",
  "Уникальное выражение Happy House. Употребляется, когда нужно подколоть друга или поднять настроение."
];

const tg = window.Telegram?.WebApp;
tg?.ready(); 
tg?.expand();
tg?.setHeaderColor?.("#0a0f1f");

let WORDS = [];
let current = null;

const list = document.getElementById("list");
const detail = document.getElementById("detail");
const dTerm = document.getElementById("dTerm");
const dDef = document.getElementById("dDef");
const dAi = document.getElementById("dAi");
const btnExplain = document.getElementById("btnExplain");
const back = document.getElementById("back");
const footerNote = document.getElementById("footerNote");

fetch("words.json")
  .then(r => r.json())
  .then(data => {
    // Принудительно меняем "Владоша" на "Владюша" при загрузке
    data.forEach(item => {
      if (item.def.includes("Владоша")) item.def = item.def.replace("Владоша", "Владюша");
      if (item.term.includes("Владоша")) item.term = item.term.replace("Владоша", "Владюша");
    });
    WORDS = data;
    render();
  })
  .catch(err => {
    list.innerHTML = "<div style='color:red; padding:20px'>Ошибка загрузки словаря.</div>";
  });

function render() {
  list.innerHTML = "";
  WORDS.forEach((w, i) => {
    const el = document.createElement("div");
    el.className = "word-item";
    el.innerHTML = `
      <div>
        <div class="word-term">${escapeHtml(w.term)}</div>
        <div class="word-def">${escapeHtml(truncate(w.def, 60))}</div>
      </div>
      <div class="chev">›</div>`;
    el.addEventListener("click", () => open(i));
    list.appendChild(el);
  });
}

function open(i) {
  current = { ...WORDS[i], idx: i };
  dTerm.textContent = current.term;
  dDef.textContent = current.def;
  
  dAi.style.display = "none";
  dAi.textContent = "";
  footerNote.style.display = "none";
  btnExplain.style.display = "block";
  btnExplain.textContent = "✨ Пояснить от ИИ";
  btnExplain.disabled = false;

  list.classList.add("hidden");
  detail.classList.remove("hidden");
  tg?.HapticFeedback?.impactOccurred("light");
}

back.addEventListener("click", () => {
  detail.classList.add("hidden");
  list.classList.remove("hidden");
  current = null;
});

btnExplain.addEventListener("click", () => {
  if (!current) return;
  
  btnExplain.textContent = "⏳ Думаю...";
  btnExplain.disabled = true;

  setTimeout(() => {
    const key = current.term.toLowerCase().trim().replace('!', '');
    let text = "";

    if (CUSTOM_EXPLANATIONS[key]) {
      const variants = CUSTOM_EXPLANATIONS[key];
      text = variants[Math.floor(Math.random() * variants.length)];
    } else {
      const defText = current.def.toLowerCase().replace(/\.$/, '');
      const randomDefault = DEFAULT_EXPLANATIONS[Math.floor(Math.random() * DEFAULT_EXPLANATIONS.length)];
      text = `«${current.term}» — это ${defText}. ${randomDefault}`;
    }

    dAi.textContent = text;
    dAi.style.display = "block";
    footerNote.style.display = "block";
    btnExplain.style.display = "none";
  }, 600);
});

function truncate(s, n) { return s.length > n ? s.slice(0, n) + "…" : s; }
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
</script>
</body>
</html>
