<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy House Dictionary</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <header class="glass header">
    <h1>Happy House</h1>
    <p class="sub">Толковый словарь · Limited Edition · 2026-2027</p>
  </header>

  <main class="glass panel" id="list"></main>

  <section class="glass panel hidden" id="detail">
    <button class="back" id="back">← Назад</button>
    <h2 id="dTerm"></h2>
    <p class="def" id="dDef"></p>
    <div class="ai" id="dAi" style="display: none;"></div>
    <button class="explain" id="btnExplain">✨ Пояснить от ИИ</button>
    <p class="footer-note" id="footerNote" style="display: none;">Сгенерировано AI, могут быть неточности</p>
  </section>

<script>
// --- БАЗА УНИКАЛЬНЫХ ПОЯСНЕНИЙ ДЛЯ КАЖДОГО СЛОВА ---
const CUSTOM_EXPLANATIONS = {
  "твою мать!": "Это междометие-паразит, которое вырвалось у одного великого участника. Используется в моменты крайнего удивления, радости или когда консультация идет не по плану. Главное — не сказать это В. Сергеевне в лицо.",
  "рыбенок": "Ласковое или шутливое обращение к ученикам младших классов (или к тем, кто ведет себя как они). Мы все тут немножко рыбки в океане знаний.",
  "мама птица": "Наша классная мама и главный человек в Happy House — Виолетта Сергеевна. Она же Чичер, она же Птичер. Заботится о птенцах, но иногда заставляет писать конспекты.",
  "сладкоежки с травмой": "Это состояние после долгого чаепития на консультации. Когда конфет съедено слишком много, живот болит, а глаза стекленеют. Психологическая (и желудочная) травма гарантирована.",
  "чичер": "Самый любимый учитель. Происхождение слова туманно, но звучит уже как родное. Синоним — Птичер.",
  "засланцы": "Те самые счастливчики, которых отправили с карточкой пахана в магазин прямо во время урока. Элитный отряд быстрого реагирования за вкусняшками.",
  "space sheeps": "Наш 9 «А» в полном составе. Космические овцы, которые летят по просторам школьной программы, иногда врезаясь в астероиды ОГЭ.",
  "птенцы": "Младшее поколение. Те, кто только готовится сдавать ОГЭ. Мы их любим, иногда покрикиваем, но в обиду не даем.",
  "хоуюжели": "Искаженное английское usually (обычно). Используется, когда нужно звучать умно, но получается как всегда.",
  "что естественно, то не безобразно": "Железобетонная отмазка Даши. Если сказал что-то не то или сделал глупость — просто напомни всем эту фразу, и ты оправдан.",
  "косоглазие с катарактой под минус двенадцать": "Фраза-отказ. Означает «я тебя не вижу и не понимаю». Идеально для моментов, когда не выучил домашку.",
  "тю": "Универсальный ответ на любую глупость. Что-то вроде «да ладно», «подумаешь» или «пустяки». Показывает, что тебя это не впечатлило.",
  "i'm pindos": "Наш неофициальный гимн. Сопровождается криком орла и мысленным включением гимна США. Просто мем, который понятен только нам.",
  "hard punishment": "Суровое наказание от В. Сергеевны (или пахана). А еще это отмазка «я не виноват, это не я». Используется по настроению.",
  "бротхер": "Искаженное brother (брат). Обращение к другу. Звучит максимально по-пацански.",
  "фатхер": "Искаженное father (отец). Тот, кто раздает советы или, наоборот, ругает.",
  "матхер": "Искаженное mother (мать). Обычно относится к В. Сергеевне или просто к заботе.",
  "щелкни, по-братски": "Просьба сфотографировать. Слово «щелкни» отсылает к звуку затвора фотоаппарата (или кнопки телефона).",
  "я (freak) тебя на подоконнике": "Легендарная фраза Владоши. В оригинале там было именно слово freak. Никаких пошлостей, только фотография на подоконнике!",
  "my *** is broken (tailbone)": "Означает «я отсидел себе всё, что можно». Обычно говорится после 3-го урока подряд за партой.",
  "блокнот": "Страшное оружие В. Сергеевны. Если она достает блокнот — кто-то сейчас получит замечание или пойдет к пахану.",
  "телевизор в канализации": "Забавный случай из жизни, когда старый кинескопный телевизор решил, что его место в канализации. Не спрашивай, как это произошло, история об этом умалчивает.",
  "сладенький асланчик": "Наш автор словаря, сдающий ОГЭ (хотя он сам в это не верит). Харизматичный, но иногда любит поныть.",
  "меня разыскивает интерпол": "Так Аслан отвечает, когда его о чем-то просят или ищут. Мол, я в бегах, не трогайте меня.",
  "максимальный буллинг и цензура": "Птенцовый режим. Когда пахан строго следит за порядком и пресекает любые попытки расслабиться.",
  "английские колонизаторы": "Мы. Просто мы на уроках английского. Захватываем внимание учителя своими знаниями (или наоборот)."
};

const tg = window.Telegram?.WebApp;
tg?.ready(); 
tg?.expand();
tg?.setHeaderColor?.("#0a0f1f");

let WORDS = [];
let current = null;

const list = document.getElementById("list");
const detail = document.getElementById("detail");
const dTerm = document.getElementById("dTerm");
const dDef = document.getElementById("dDef");
const dAi = document.getElementById("dAi");
const btnExplain = document.getElementById("btnExplain");
const back = document.getElementById("back");
const footerNote = document.getElementById("footerNote");

fetch("words.json")
  .then(r => r.json())
  .then(data => {
    WORDS = data;
    render();
  })
  .catch(err => {
    list.innerHTML = "<div style='color:red; padding:20px'>Ошибка загрузки словаря. Проверь words.json</div>";
  });

function render() {
  list.innerHTML = "";
  WORDS.forEach((w, i) => {
    const el = document.createElement("div");
    el.className = "word-item";
    el.innerHTML = `
      <div>
        <div class="word-term">${escapeHtml(w.term)}</div>
        <div class="word-def">${escapeHtml(truncate(w.def, 60))}</div>
      </div>
      <div class="chev">›</div>`;
    el.addEventListener("click", () => open(i));
    list.appendChild(el);
  });
}

function open(i) {
  current = { ...WORDS[i], idx: i };
  dTerm.textContent = current.term;
  dDef.textContent = current.def;
  
  dAi.style.display = "none";
  dAi.textContent = "";
  footerNote.style.display = "none";
  btnExplain.style.display = "block";
  btnExplain.textContent = "✨ Пояснить от ИИ";
  btnExplain.disabled = false;

  list.classList.add("hidden");
  detail.classList.remove("hidden");
  tg?.HapticFeedback?.impactOccurred("light");
}

back.addEventListener("click", () => {
  detail.classList.add("hidden");
  list.classList.remove("hidden");
  current = null;
});

btnExplain.addEventListener("click", () => {
  if (!current) return;
  
  btnExplain.textContent = "⏳ Думаю...";
  btnExplain.disabled = true;

  setTimeout(() => {
    const key = current.term.toLowerCase().trim();
    // Берем уникальное пояснение, если оно есть. Если нет — генерируем общее.
    let text = CUSTOM_EXPLANATIONS[key];
    
    if (!text) {
      text = `«${current.term}» — это ${current.def.toLowerCase().replace(/\.$/, '')}. Это словечко из внутреннего сленга нашего класса. Обычно используется в узком кругу для описания забавной ситуации. Свои поймут!`;
    }

    dAi.textContent = text;
    dAi.style.display = "block";
    footerNote.style.display = "block";
    btnExplain.style.display = "none";
  }, 600);
});

function truncate(s, n) { return s.length > n ? s.slice(0, n) + "…" : s; }
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
</script>
</body>
</html>
